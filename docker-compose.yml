# Valheim dedicated server — dedicated Hetzner host.
# Only the UDP game ports are public (the Steam protocol requires it); the HTTP
# status/admin port stays bound to 127.0.0.1. See SECURITY.md.
# Resource caps are kept so a runaway server degrades the game, not the host.
services:
  valheim:
    image: ghcr.io/lloesche/valheim-server:latest
    container_name: valheim-server
    hostname: valheim
    restart: unless-stopped
    stop_grace_period: 2m          # let the world save cleanly before SIGKILL
    cap_add:
      - SYS_NICE                   # required by the image to set thread priorities
    security_opt:
      # Blocks privilege escalation via setuid binaries inside the container.
      # Verified compatible with this image's PUID/PGID user switching.
      - no-new-privileges:true
    networks:
      - valheim_net
    ports:
      # Game traffic MUST be publicly reachable — the Steam UDP protocol cannot
      # sit behind an HTTP access proxy. Documented exception, see SECURITY.md.
      - "0.0.0.0:${VALHEIM_PORT:-2456}:2456/udp"
      - "0.0.0.0:${VALHEIM_QUERY_PORT:-2457}:2457/udp"
      # Status page: host-local only (reach it via `ssh -L 9080:127.0.0.1:9080`)
      - "127.0.0.1:9080:80"
    env_file:
      - .env
    environment:
      SERVER_PORT: "2456"
      SERVER_PUBLIC: "${SERVER_PUBLIC:-true}"
      # Default '-crossplay' lets Xbox/Game Pass players join. Clear SERVER_ARGS
      # in .env for Steam-only matchmaking.
      SERVER_ARGS: "${SERVER_ARGS:--crossplay}"
      # Automatic world backups inside the container's /config/backups
      BACKUPS: "true"
      BACKUPS_INTERVAL: "3600"
      BACKUPS_DIRECTORY: "/config/backups"
      BACKUPS_MAX_AGE: "7"
      BACKUPS_MAX_COUNT: "12"
      # Auto-update + restart window (UTC). 05:00 = low-traffic hours locally.
      UPDATE_CRON: "0 5 * * *"
      RESTART_IF_IDLE: "true"
      STATUS_HTTP: "true"
      STATUS_HTTP_PORT: "80"
      TZ: "${TZ:-Europe/Bucharest}"
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./config:/config
      - ./data:/opt/valheim
    # ---- Resource caps ---------------------------------------------------
    # Sized for a dedicated 8GB box: leaves ~2GB + 1 core to the OS.
    # preflight.sh refuses to deploy if the host cannot back these numbers.
    mem_limit: ${VALHEIM_MEM_LIMIT:-6g}
    mem_reservation: 2g
    cpus: ${VALHEIM_CPUS:-3.0}
    pids_limit: 512
    oom_score_adj: 500             # sacrifice Valheim before host-critical procs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  valheim_net:
    name: valheim_net
    driver: bridge
